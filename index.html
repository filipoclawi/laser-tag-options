<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Lasertag – aktuelle Optionen</title><h1>Lasertag – aktuelle Optionen</h1><p>Öffentliche, schreibgeschützte Arena-Verfügbarkeit ohne Teilnehmerdaten. Keine Reservation oder Zusage.</p><p><a href="options.json">Aktuelle Optionen als JSON</a></p><p id="status">Verfügbarkeit wird geprüft …</p><pre id="options"></pre><script>fetch('options.json?check='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{const age=Date.now()/1000-d.checkedAt,stale=d.stale||!Number.isFinite(age)||age<0||age>7200;document.getElementById('status').textContent=stale?'Veraltet – nicht für Zusagen verwenden.':'Zuletzt vollständig geprüft: '+new Date(d.checkedAt*1000).toLocaleString('de-CH');document.getElementById('options').textContent=stale?'':d.candidates.map(x=>'Option '+x.option+' · '+x.date+' · '+x.start+'–'+x.end).join('\n')}).catch(()=>document.getElementById('status').textContent='Abruf fehlgeschlagen – Verfügbarkeit unbekannt.')</script></html>
